suite_schema_version: 1
name: cps_reason_graph_v2
version: 1.0.0
description: Complete CPS Reason Bench 0.5.0 graph-dependent reasoning suite.
task_families:
- prospective_reasoning
- planning
- interference
- conditional_safety
- adaptation
- temporal_tracking
interaction:
  source: scenario
context:
  source: scenario
protocol:
  prompt:
    id: cps-reason-json-control
    version: 2.0.0
  schema:
    id: cps-reason-decision
    version: 1.0.0
  output_validation_policy: strict
  retry_policy:
    name: strict_zero_correction
    max_corrections: 0
evaluation:
  analysis_unit: semantic_condition_x_simulator_seed
  default_model_repetitions: 5
  scripted_reference_repetitions: 1
  seeded_random_repetitions: 5
  cluster_repetitions_by_analysis_unit: true
  model_repetition_seed_policy: fixed_per_model_condition
metric_requirements:
  prospective_reasoning:
  - task_success
  - safety_violations
  - graph_dependent_decision_correct
  - graph_exact_action_sequence_agreement
  planning:
  - task_success
  - safety_violations
  - graph_dependent_decision_correct
  - graph_exact_action_sequence_agreement
  interference:
  - task_success
  - safety_violations
  - graph_dependent_decision_correct
  - graph_exact_action_sequence_agreement
  conditional_safety:
  - task_success
  - safety_violations
  - graph_dependent_decision_correct
  - graph_exact_action_sequence_agreement
  adaptation:
  - task_success
  - safety_violations
  - graph_dependent_decision_correct
  - graph_exact_action_sequence_agreement
  temporal_tracking:
  - task_success
  - safety_violations
  - graph_dependent_decision_correct
  - graph_exact_action_sequence_agreement
difficulty_configurations: {}
