[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cps-reason-bench"
version = "0.5.0"
description = "Reproducible graph-based cyber-physical decision-making benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CPS Reason Bench contributors"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]
plots = ["matplotlib>=3.8"]

[project.scripts]
cps-reason = "cps_reason_bench.public_cli:main"
cps-reason-bench = "cps_reason_bench.public_cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
cps_reason_bench = ["data/**/*.yaml", "data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: explicitly authorized live provider tests (not part of the offline suite)"]
