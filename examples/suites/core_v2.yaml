suite_schema_version: 1
name: cps_reason_core_v2
version: 2.0.0
description: Compact six-family suite spanning four intended controlled levels per family.
task_families:
  - prospective_reasoning
  - planning
  - interference
  - conditional_safety
  - adaptation
  - temporal_tracking

difficulty_configurations:
  prospective_reasoning:
    basic: {content_revision: core_v2}
    controlled_2: {content_revision: core_v2}
  planning:
    basic: {content_revision: core_v2, resource_slack: 0}
    controlled_2: {content_revision: core_v2, resource_slack: 0}
  interference:
    basic: {content_revision: core_v2, evidence_conflict_count: 1}
    controlled_2: {content_revision: core_v2, evidence_conflict_count: 2}
  conditional_safety:
    basic:
      content_revision: core_v2
      rule_count: 1
      candidate_inspection_count: 2
      inspection_budget: 1
    controlled_2:
      content_revision: core_v2
      rule_count: 1
      candidate_inspection_count: 2
      inspection_budget: 1

interaction: {source: scenario}
context: {source: scenario}
protocol:
  prompt: {id: cps-reason-json-control, version: 2.0.0}
  schema: {id: cps-reason-decision, version: 1.0.0}
  output_validation_policy: strict
  retry_policy: {name: strict_zero_correction, max_corrections: 0}
evaluation: {}

metric_requirements:
  prospective_reasoning:
    - general.task_success
    - task_specific.callback_count
    - task_specific.missed_relevant_events
    - task_specific.reaction_delay_steps
  planning:
    - general.task_success
    - task_specific.planning_action_attempts
    - task_specific.prerequisite_violations
    - task_specific.planning_resource_consumption
  interference:
    - general.task_success
    - task_specific.misleading_action_rate
    - task_specific.unnecessary_emergency_action_rate
    - task_specific.evidence_gathering_action_count
  conditional_safety:
    - general.task_success
    - task_specific.required_inspection_coverage
    - task_specific.missed_falsifying_observations
    - task_specific.unnecessary_inspection_count
    - task_specific.final_rule_satisfaction
  adaptation:
    - general.task_success
    - task_specific.adaptation_success
    - task_specific.adaptation_delay_steps
    - task_specific.obsolete_actions_before_sufficient_evidence
    - task_specific.obsolete_actions_after_sufficient_evidence
    - task_specific.recovery_time_steps
  temporal_tracking:
    - general.task_success
    - task_specific.temporal_reasoning_success
    - task_specific.temporal_comparison_accuracy
    - task_specific.delayed_effect_detection_accuracy
    - task_specific.delayed_effect_attribution_accuracy
    - task_specific.false_temporal_associations
    - task_specific.missed_temporal_dependencies

scenarios:
  - id: prospective_level_1
    generator: {family: prospective_reasoning, level: basic, version: 2.0.0, generation_seed: 2101, template: ../scenarios/prospective_basic.yaml}
    simulator_seeds: [1101]
  - id: prospective_level_2
    generator: {family: prospective_reasoning, level: controlled_2, version: 2.0.0, generation_seed: 2102, template: ../scenarios/prospective_basic.yaml}
    simulator_seeds: [1102]
  - id: prospective_level_3
    generator: {family: prospective_reasoning, level: controlled_3, version: 2.0.0, generation_seed: 2103, template: ../scenarios/prospective_basic.yaml}
    simulator_seeds: [1103]
  - id: prospective_level_4
    generator: {family: prospective_reasoning, level: controlled_4, version: 2.0.0, generation_seed: 2104, template: ../scenarios/prospective_basic.yaml}
    simulator_seeds: [1104]

  - id: planning_level_1
