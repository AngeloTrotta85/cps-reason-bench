suite_schema_version: 1
name: cps_reason_core_v2_smoke
version: 2.0.0
description: Very small strict smoke suite covering all six single-LLM CPS reasoning families.
task_families:
  - prospective_reasoning
  - planning
  - interference
  - conditional_safety
  - adaptation
  - temporal_tracking

difficulty_configurations:
  prospective_reasoning:
    basic: {content_revision: core_v2}
  planning:
    basic: {content_revision: core_v2, resource_slack: 0}
  interference:
    basic: {content_revision: core_v2, evidence_conflict_count: 1}
  conditional_safety:
    basic:
      content_revision: core_v2
      rule_count: 1
      candidate_inspection_count: 2
      inspection_budget: 1

interaction: {source: scenario}
context: {source: scenario}
protocol:
  prompt: {id: cps-reason-json-control, version: 2.0.0}
  schema: {id: cps-reason-decision, version: 1.0.0}
  output_validation_policy: strict
  retry_policy: {name: strict_zero_correction, max_corrections: 0}
evaluation: {}

metric_requirements:
  prospective_reasoning:
    - general.task_success
    - task_specific.missed_relevant_events
    - task_specific.reaction_delay_steps
  planning:
    - general.task_success
    - task_specific.planning_action_attempts
    - task_specific.prerequisite_violations
  interference:
    - general.task_success
    - task_specific.misleading_action_rate
    - task_specific.evidence_gathering_action_count
  conditional_safety:
    - general.task_success
    - task_specific.required_inspection_coverage
    - task_specific.final_rule_satisfaction
  adaptation:
    - general.task_success
    - task_specific.adaptation_success
    - task_specific.adaptation_delay_steps
    - task_specific.obsolete_actions_after_sufficient_evidence
  temporal_tracking:
    - general.task_success
    - task_specific.temporal_reasoning_success
    - task_specific.delayed_effect_attribution_accuracy
    - task_specific.false_temporal_associations

scenarios:
  - id: prospective_smoke
    generator:
      family: prospective_reasoning
      level: basic
      version: 2.0.0
      generation_seed: 2101
      template: ../scenarios/prospective_basic.yaml
    simulator_seeds: [1101]
  - id: planning_smoke
    generator:
      family: planning
      level: basic
      version: 2.0.0
      generation_seed: 2201
      template: ../scenarios/planning_basic.yaml
    simulator_seeds: [1201]
  - id: interference_smoke
    generator:
      family: interference
      level: basic
      version: 2.0.0
      generation_seed: 2301
      template: ../scenarios/interference_basic.yaml
    simulator_seeds: [1301]
  - id: conditional_smoke
    generator:
      family: conditional_safety
      level: basic
      version: 2.0.0
      generation_seed: 2401
      template: ../scenarios/conditional_safety_basic.yaml
    simulator_seeds: [1401]
  - id: adaptation_smoke
    generator:
      family: adaptation
      level: controlled_1
      version: 2.0.0
      generation_seed: 2501
      template: ../scenarios/adaptation_basic.yaml
    simulator_seeds: [1501]
  - id: temporal_smoke
    generator:
      family: temporal_tracking
      level: controlled_1
      version: 2.0.0
      generation_seed: 2601
      template: ../scenarios/temporal_tracking_basic.yaml
    simulator_seeds: [1601]
