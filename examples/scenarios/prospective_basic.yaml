schema_version: 1
name: prospective_basic
description: Schedule or subscribe before a drifting process load becomes unsafe.
task_family: prospective_reasoning
difficulty: 1
difficulty_level: basic
difficulty_profile:
  family_parameters:
    control_challenge: callback_or_event_threshold
  number_of_nodes: 1
  number_of_state_variables: 1
  number_of_valid_actions: 2
  number_of_distractor_actions: 0
  minimum_required_planning_depth: 1
  number_of_prerequisites: 0
  number_of_interacting_goals: 1
  number_of_constraints: 1
  number_of_hidden_state_variables: 0
  maximum_observation_delay_steps: 0
  maximum_sensor_noise_std: 0.0
  number_of_faults: 0
  initial_resources: {intervention_energy: 1.0}
  resource_scarcity:
    intervention_energy: {initial: 1.0, reference_cost: 1.0, margin: 0.0, initial_to_reference_cost_ratio: 1.0}
  callback_timing_tolerance_steps: 1
  number_of_candidate_event_subscriptions: 2
  number_of_misleading_observations: 0
  number_of_possible_safety_rule_violations: 1
seed: 11
max_steps: 8
time_step: 1.0

task:
  instructions: Keep reactor load at or below 7 while minimizing interventions. Arrange a future callback or event monitor instead of assuming you will be called every step.
  objectives:
    - Finish with reactor load at or below 7.
    - Use no more than one unit of intervention energy.
  safety_rules:
    - Reactor load must never exceed 7.

graph:
  nodes:
    reactor:
      label: Abstract process zone
      variables:
        load:
          initial: 2.0
          drift: 1.0
          hard_min: 0.0
          hard_max: 10.0
  edges: []
  resources:
    intervention_energy:
      initial: 1.0
      min: 0.0
      observable: true

sensors:
  - id: load_sensor
    target: reactor.load
    noise_std: 0.0
    delay_steps: 0
    observable: true

actions:
  - id: relieve_load
    operation: adjust
    target: reactor.load
    amount: -4.0
    costs:
      intervention_energy: 1.0
    description: Reduce reactor load by 4 using one energy unit.
  - id: wait
    operation: noop
    description: Apply no physical intervention.

faults: []
constraints:
  - id: load_upper_limit
    kind: bounds
    target: reactor.load
    max: 7.0
goals:
  - id: finish_safe
    condition:
      target: reactor.load
      operator: le
      value: 7.0

observability:
  full_state: false
interaction:
  mode: scheduled_event
  initial_invocation: true
  min_callback_steps: 1
  max_callback_steps: 6
  max_actions_per_interaction: 1
  allowed_event_types:
    - variable_threshold
    - safety_violation
context:
  mode: current
  history_limit: 3
  include_action_outcomes: true
  include_public_events: true
evaluation:
  callback_target_window: [3, 4]
  required_actions: [relieve_load]
  reference_action_count: 1
  success_requires_safety: true
baseline:
  script:
    - at_step: 0
      decision:
        actions: []
        callback:
          after_steps: 4
        subscriptions:
          - operation: add
            id: watch_load
            event_type: variable_threshold
            filters:
              target: reactor.load
              operator: ge
              threshold: 5.0
        context_requests: [active_subscriptions]
    - at_step: 3
      decision:
        actions:
          - action_id: relieve_load
        callback: null
        subscriptions:
          - operation: remove
            id: watch_load
        context_requests: []
  default_decision:
    actions: []
    callback: null
    subscriptions: []
    context_requests: []
reference:
  kind: feasible_reference
  evidence: scripted policy replay
  optimality: not_claimed
