suite_schema_version: 1
name: cps_reason_foundation_v1
version: 1.0.0
description: Twenty-four additive foundation tasks spanning entry_1 through bridge for six reasoning families.
task_families:
  - prospective_reasoning
  - planning
  - interference
  - conditional_safety
  - adaptation
  - temporal_tracking
difficulty_configurations:
  prospective_reasoning:
    entry_1: {content_revision: foundation_v1}
    entry_2: {content_revision: foundation_v1}
    entry_3: {content_revision: foundation_v1}
    bridge: {content_revision: foundation_v1}
  planning:
    entry_1: {content_revision: foundation_v1}
    entry_2: {content_revision: foundation_v1}
    entry_3: {content_revision: foundation_v1}
    bridge: {content_revision: foundation_v1}
  interference:
    entry_1: {content_revision: foundation_v1}
    entry_2: {content_revision: foundation_v1}
    entry_3: {content_revision: foundation_v1}
    bridge: {content_revision: foundation_v1}
  conditional_safety:
    entry_1: {content_revision: foundation_v1}
    entry_2: {content_revision: foundation_v1}
    entry_3: {content_revision: foundation_v1}
    bridge: {content_revision: foundation_v1}
  adaptation:
    entry_1: {content_revision: foundation_v1}
    entry_2: {content_revision: foundation_v1}
    entry_3: {content_revision: foundation_v1}
    bridge: {content_revision: foundation_v1}
  temporal_tracking:
    entry_1: {content_revision: foundation_v1}
    entry_2: {content_revision: foundation_v1}
    entry_3: {content_revision: foundation_v1}
    bridge: {content_revision: foundation_v1}
interaction: {source: scenario}
context: {source: scenario}
protocol:
  prompt: {id: cps-reason-json-control, version: 2.0.0}
  schema: {id: cps-reason-decision, version: 1.0.0}
  output_validation_policy: strict
  retry_policy: {name: strict_zero_correction, max_corrections: 0}
evaluation: {}
metric_requirements:
  prospective_reasoning:
    - general.task_success
    - task_specific.callback_count
    - task_specific.useful_subscription_count
    - task_specific.missed_relevant_events
    - task_specific.reaction_delay_steps
  planning:
    - general.task_success
    - task_specific.planning_action_attempts
    - task_specific.prerequisite_violations
    - task_specific.planning_resource_consumption
  interference:
    - general.task_success
    - task_specific.misleading_action_rate
    - task_specific.unnecessary_emergency_action_rate
    - task_specific.evidence_gathering_action_count
  conditional_safety:
    - general.task_success
    - task_specific.missed_falsifying_observations
    - task_specific.unnecessary_inspection_count
    - task_specific.final_rule_satisfaction
  adaptation:
    - general.task_success
    - task_specific.adaptation_success
    - task_specific.adaptation_delay_steps
    - task_specific.obsolete_actions_before_sufficient_evidence
    - task_specific.obsolete_actions_after_sufficient_evidence
  temporal_tracking:
    - general.task_success
    - task_specific.temporal_reasoning_success
    - task_specific.delayed_effect_detection_accuracy
    - task_specific.delayed_effect_attribution_accuracy
    - task_specific.false_temporal_associations
    - task_specific.missed_temporal_dependencies
scenarios:
  - id: prospective_entry_1
    generator: {family: prospective_reasoning, level: entry_1, version: 3.0.0, generation_seed: 3101, template: ../scenarios/foundation/prospective_entry.yaml}
    simulator_seeds: [4101]
  - id: prospective_entry_2
    generator: {family: prospective_reasoning, level: entry_2, version: 3.0.0, generation_seed: 3102, template: ../scenarios/foundation/prospective_entry.yaml}
    simulator_seeds: [4102]
  - id: prospective_entry_3
